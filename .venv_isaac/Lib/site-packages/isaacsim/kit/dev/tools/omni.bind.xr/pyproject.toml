[build-system]
requires = [
    "poetry-core >= 1.1.3"
]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = 'omni.bind'
version = '0.1.0'
description = 'TODO'
authors = [
    "Travis Gockel <tgockel@nvidia.com>",
    "Nathan Cournia <ncournia@nvidia.com>"
]

[tool.poetry.dependencies]
python = "^3.10"
libclang = "^12.0"

[tool.poetry.dev-dependencies]
coverage = {version = "^6.3.2", extras = ["toml"]}
filelock = ">=3.20.3,<4.0"
jinja2 = ">=3.1.6,<4.0"
pylint = "^2.12.3"
pylint-json2html = "^0.4.0"
tox = "^4.0"
types-clang = "^0.12.2"
pyright = "^1.1.239"
virtualenv = ">=20.36.1,<22.0"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 10
include = ["omni/bind/*"]
skip_empty = true

[tool.pylint.master]
load-plugins = "pylint_json2html"

[tool.pylint.messages_control]
disable = ["duplicate-code",          # Copyright is detected as duplicate
           "import-outside-toplevel", # Useful for reducing load time and for solving circular dependencies
           "protected-access",        # Use of _method acceptable if done with care
           "no-else-return",          # Bad rules follow (no explanation required)
           "too-few-public-methods",
           "too-many-public-methods",
           "unnecessary-ellipsis"]

[tool.pylint.format]
ignore-long-lines = "^\\s*(# )?<?https?://\\S+>?$"

[tool.pyright]
include = ["omni/bind"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{310, 311, 312}
skipsdist = true
isolated_build = true

[testenv]
allowlist_externals = poetry
commands_pre =
    poetry install -v
commands =
    coverage run -m unittest discover -v
    coverage html
    coverage json
    pylint omni/bind -j 0 --exit-zero --output-format=jsonextended > pylint.json
    pylint-json2html -f jsonextended pylint.json --output pylint.html
    - pyright
"""
