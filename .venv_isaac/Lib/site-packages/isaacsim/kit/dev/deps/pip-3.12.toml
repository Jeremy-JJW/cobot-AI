    "coverage==7.4.4",             # OSRB filed under: https://nvbugs/4575647
    "watchdog==4.0.0",             # OSRB filed under: https://nvbugs/4575649
    "sentry-sdk==2.42.1",          # OSRB filed under: https://nvbugs/4575650
