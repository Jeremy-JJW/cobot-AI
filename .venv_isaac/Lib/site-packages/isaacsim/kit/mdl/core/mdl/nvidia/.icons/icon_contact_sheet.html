<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NVIDIA MDL Icons Contact Sheet</title>
  <style>
    :root {
      --bg: #111318;
      --card: #1a1f27;
      --border: #2b3340;
      --text: #e7ebf2;
      --muted: #9ea8b7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1800px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 600;
    }
    .meta {
      color: var(--muted);
      margin-bottom: 16px;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      background: #101724;
      border: 1px solid #31415f;
      border-radius: 8px;
    }
    img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      /* Make dark SVG strokes readable on dark backgrounds. */
      filter: brightness(0) invert(95%) drop-shadow(0 0 2px rgba(173, 251, 71, 0.35));
    }
    .name {
      width: 100%;
      text-align: center;
      color: var(--text);
      font-size: 12px;
      line-height: 1.25;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>NVIDIA MDL Icon Contact Sheet</h1>
    <div class="meta">Folder: <code>source/mdl/nvidia/icons</code> &middot; <span id="count">0</span> icons</div>
    <div id="grid" class="grid"></div>
  </div>
  <script>
    const icons = [
      "Abs.svg",
      "Acos.svg",
      "Add.svg",
      "add_cutouts.svg",
      "add_displacement.svg",
      "add_emission.svg",
      "add_global_bumpmap.svg",
      "add_round_edges.svg",
      "add_simple_sticker.svg",
      "add_thermal_emission.svg",
      "add_vector_displacement.svg",
      "animation_time.svg",
      "apply_clear_coating.svg",
      "apply_color_falloff.svg",
      "apply_dust_cover.svg",
      "apply_flake_coating.svg",
      "apply_thin_film.svg",
      "apply_thin_metal_coating.svg",
      "Asin.svg",
      "Atan.svg",
      "Atan2.svg",
      "Average.svg",
      "biased_color_blend.svg",
      "bitmap_texture.svg",
      "blackbody.svg",
      "Blend.svg",
      "Ceil.svg",
      "cellular_noise_texture.svg",
      "checker_3d_texture.svg",
      "Clamp.svg",
      "compare.svg",
      "Comparison.svg",
      "component_extract.svg",
      "condition.svg",
      "constructor.svg",
      "Cos.svg",
      "cross_product.svg",
      "data_lookup.svg",
      "Degrees.svg",
      "Distance.svg",
      "Divide.svg",
      "Dot.svg",
      "Equality.svg",
      "Exp.svg",
      "Exp2.svg",
      "Floor.svg",
      "flow_noise_texture.svg",
      "Fmod.svg",
      "Frac.svg",
      "generic_blend.svg",
      "hextiling.svg",
      "Length.svg",
      "Lerp.svg",
      "Log.svg",
      "Log10.svg",
      "Log2.svg",
      "Luminance.svg",
      "Max.svg",
      "meters_per_scene_unit.svg",
      "Min.svg",
      "Multiply.svg",
      "normal.svg",
      "Normalize.svg",
      "normal_map_texture.svg",
      "object_id.svg",
      "perlin_noise_texture.svg",
      "PI.svg",
      "position.svg",
      "Pow.svg",
      "Radians.svg",
      "Remap.svg",
      "rotation.svg",
      "Round.svg",
      "Rsqrt.svg",
      "Saturate.svg",
      "scene_units_per_meter.svg",
      "Sign.svg",
      "Sin.svg",
      "sincos.svg",
      "Smoothstep.svg",
      "Sqrt.svg",
      "Step.svg",
      "Subtract.svg",
      "surface_falloff.svg",
      "Tan.svg",
      "texture_coordinate.svg",
      "texture_height.svg",
      "texture_isvalid.svg",
      "texture_lookup.svg",
      "texture_tangent.svg",
      "texture_width.svg",
      "transform.svg",
      "triplanar_texture.svg",
      "two_sided_materials.svg"
    ].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

    const grid = document.getElementById("grid");
    document.getElementById("count").textContent = String(icons.length);
    for (const name of icons) {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div class="icon-box"><img src="./${name}" alt="${name}" loading="lazy" /></div>
        <div class="name">${name}</div>
      `;
      grid.appendChild(item);
    }
  </script>
</body>
</html>
