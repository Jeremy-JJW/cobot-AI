<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBOT AI 聊天</title>
  <link rel="stylesheet" href="/static/css/app.css?v=18">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="breadcrumb">
        <span class="brand-name">COBOT AI</span>
        <span class="sep">&gt;</span>
        <span class="page-name">聊天</span>
      </div>
      <div class="header-right">
        <button class="restart-btn" id="clearAlarmBtn" type="button" title="清除報警" aria-label="清除報警">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </button>
        <button class="restart-btn" id="restartBtn" type="button" title="重啓服務" aria-label="重啓服務">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
        <div class="status-pill idle" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">未連接</span>
        </div>
      </div>
    </header>

    <div class="alarm-banner" id="alarmBanner" style="display:none">
      <span class="alarm-icon">⚠️</span>
      <span class="alarm-text">機械臂報警中</span>
      <button class="clear-alarm-btn" id="clearAlarmBtn">清除報警</button>
    </div>

    <main class="chat-main">
      <div class="chat-log" id="chatLog">
        <div class="msg-row msg-bot">
          <div class="avatar avatar-bot" aria-hidden="true">AI</div>
          <div class="bubble">
            <p>你好，請輸入機械臂動作指令，發送後將自動分析並控制機械臂。<br><span class="hint">示例：抬高 20 毫米 / 去 A 點 / 在桌面上畫一個小圓</span></p>
          </div>
        </div>
      </div>
    </main>

    <footer class="composer">
      <div class="input-box">
        <textarea
          id="commandInput"
          rows="1"
          placeholder="輸入機械臂動作指令（Enter 發送）"
        ></textarea>
        <button class="mic-btn" id="micBtn" type="button" aria-label="語音輸入" title="語音輸入">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button class="send-btn" id="executeBtn" type="button" aria-label="發送">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="/static/js/app.js?v=18"></script>
</body>
</html>
